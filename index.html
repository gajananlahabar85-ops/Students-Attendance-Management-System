<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-ReUse - E-Waste Upload</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #198754;
        }

        p {
            color: #555;
        }

        .upload-box {
            border: 2px dashed #198754;
            padding: 35px;
            border-radius: 12px;
            margin-top: 25px;
        }

        input[type="file"] {
            margin: 20px;
        }

        button {
            background: #198754;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #146c43;
        }

        #preview {
            max-width: 300px;
            max-height: 250px;
            margin-top: 20px;
            border-radius: 10px;
            display: none;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            color: #198754;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>♻️ E-ReUse</h1>

        <h2>E-Waste Image Upload</h2>

        <p>
            Upload an image of your electronic waste
            for component identification and reuse assessment.
        </p>

        <div class="upload-box">

            <input 
                type="file" 
                id="imageInput" 
                accept="image/*"
            >

            <br>

            <img id="preview" alt="Image Preview">

            <br><br>

            <button onclick="analyzeImage()">
                Analyze E-Waste
            </button>

            <div id="result"></div>

        </div>

    </div>

    <script>

        const imageInput = document.getElementById("imageInput");
        const preview = document.getElementById("preview");

        imageInput.addEventListener("change", function() {

            const file = this.files[0];

            if (file) {

                const reader = new FileReader();

                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = "block";
                };

                reader.readAsDataURL(file);
            }

        });

        function analyzeImage() {

            const file = imageInput.files[0];

            if (!file) {
                alert("Please upload an E-Waste image first.");
                return;
            }

            document.getElementById("result").innerHTML =
                "✅ Image uploaded successfully! Analysis will start...";

        }

    </script>

</body>
</html>
